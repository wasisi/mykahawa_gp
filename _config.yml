baseurl: null
description: 'Kenya coffee market intelligence: Nairobi Coffee Exchange prices, coffee exporters, dealers, millers, cooperatives and estates.'
lang: en
locale: en_KE
exclude:
- bin
- scripts
- source
- security
- vendor
- templates
- requirements.txt
- README.md
- Gemfile*
- package-lock.json
- "*.code-workspace"
- .out
# Raw datasets are not published on the website (they feed scripts/build_data.py).
# Only the summaries the browser needs are served: data/growers/growers.json,
# data/growers/growers_map.geojson, data/market/sales.json, data/market/grade_prices.json
- data/transactions
- data/dealers
- data/grades
- data/counties
- data/growers/coffeegrowers.csv
- data/growers/coffeegrowers.json
- data/growers/coffeegrowers_location.csv
- data/growers/coffeegrowers_location.geojson
- data/market/marketprice.json
- data/market/price_ave.json
- data/market/price_max.json
- data/market/price_min.json
- data/market/value.json
- data/market/weight.json

# Conversion
markdown: kramdown
excerpt_separator: <!--more-->

# Outputting
permalink: /:categories/:title.html

# Extend functionality with plugins
plugins:
- jekyll-redirect-from
- jekyll-sitemap
- jekyll-seo-tag
timezone: Africa/Nairobi

# Config for profile
title: MyKahawa
name: MyKahawa           # Your name
avatar: /theme/img/logo-152.png   # Path to an avatar image

url: https://www.mykahawa.org
BASE_PATH: https://www.mykahawa.org

# jekyll-seo-tag
logo: /theme/img/logo.png
social:
  name: MyKahawa
  links:
    - https://twitter.com/my_kahawa
    - https://www.facebook.com/mykahawa
    - https://github.com/wasisi/mykahawa_gp
twitter:
  username: my_kahawa


# Add a directory to hold misc pages, just to keep the root directory clean.
include: ["_node"]

# Wire in the SASS files in the theme directory.
sass:
  sass_dir: theme/_sass
  style: compressed

# Turn the projects into a collection.
collections:
  projects:
    output: true
    title: Projects
    permalink: /:collection/:name.html
  producers:
    # Grower profiles; shown on the matching grower page (_growers), not as separate pages.
    output: false
    title: Producers
  reports:
    # Market reports at /reports/<name>/
    output: true
    title: Market reports
    permalink: /reports/:name/
  growers:
    # Generated by scripts/build_data.py: one page per grower at /producer/<id>/<slug>/
    output: true
    title: Growers
  traders:
    output: true
    title: Traders
    permalink: /:collection/:name.html      
    
defaults:
# Turn the profile sidebar on for all pages by default, except for the
# collections, where it is off and replaced by useful things on the sidebar.
# To override this on a page, use
#    show_profile: false
# to hide the profile.
  -
    scope:
      path: ""
    values:
      show_profile: true
      image: /theme/img/og-image.jpg
  -
    scope:
      path: "_posts"
    values:
      show_profile: false
      layout: defaults/post
  -
    scope:
      path: "_producers"
    values:
      show_profile: false
      layout: defaults/producer
  -
    scope:
      path: "_traders"
    values:
      show_profile: false
      layout: defaults/trader
  -
    scope:
      path: "_projects"
    values:
      show_profile: false
      layout: defaults/project
  -
    scope:
      path: "list"
    values:
      show_profile: false
      layout: defaults/list