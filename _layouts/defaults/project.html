---
layout: default
---

<h1 class="border border-top-0 border-right-0 border-left-0 mb-3 pb-2">
    {{ page.heading | default: page.title }}
</h1>

<div class="d-md-block d-lg-none">
    {% include components/project-meta.html %}
</div>

{{ content }}

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var list = document.querySelectorAll('.header-list');
    document.querySelectorAll('#main-content h2').forEach(function (h2, idx) {
      if (!h2.id) h2.id = 'section-' + (idx + 1);
      list.forEach(function (ul) {
        var li = document.createElement('li');
        li.className = 'nav-item';
        var a = document.createElement('a');
        a.className = 'nav-link bg-white mb-1';
        a.href = '#' + h2.id;
        a.textContent = h2.textContent.trim();
        li.appendChild(a);
        ul.appendChild(li);
      });
    });
  });
</script>
